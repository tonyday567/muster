<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>⚛ muster desk</title>
  <style>
    :root {
      --bg: #1b1e23;
      --surface: #21252d;
      --border: #373c45;
      --text: #c8ccd4;
      --muted: #777d87;
      --accent: #4B7FBD;
      --link: #C44E8A;
      --live: #3fa47e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
      gap: 0.5rem;
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    header strong { color: var(--accent); font-weight: 600; }
    #status { color: var(--muted); }
    #status.ok { color: var(--live); }
    #status.bad { color: var(--link); }
    #log {
      flex: 1;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #log .line { margin: 0.15rem 0; }
    form {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      border-top: 1px solid var(--border);
      padding-top: 0.5rem;
    }
    textarea {
      width: 100%;
      min-height: 4.5rem;
      resize: vertical;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.6rem;
      font: inherit;
    }
    textarea:focus { outline: 1px solid var(--accent); }
    .row { display: flex; gap: 0.5rem; align-items: center; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.4rem 0.9rem;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    input#wsurl {
      flex: 1;
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem 0.5rem;
      font: inherit;
    }
  </style>
</head>
<body>
  <header>
    <strong>⚛ muster desk</strong>
    <span id="status">connecting…</span>
    <input id="wsurl" value="ws://127.0.0.1:9162/" />
    <button type="button" id="reconnect">reconnect</button>
  </header>
  <div id="log"></div>
  <form id="compose">
    <textarea id="msg" placeholder="type → bus (⌘/Ctrl+Enter to send)"></textarea>
    <div class="row">
      <button type="submit" id="send">send</button>
      <span style="color:var(--muted);font-size:0.8rem">same bus as muster post/read</span>
    </div>
  </form>
  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const msgEl = document.getElementById('msg');
    const urlEl = document.getElementById('wsurl');
    let ws;

    function append(line) {
      const d = document.createElement('div');
      d.className = 'line';
      d.textContent = line;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || '';
    }

    function connect() {
      if (ws) try { ws.close(); } catch (_) {}
      const url = urlEl.value.trim();
      setStatus('connecting…');
      ws = new WebSocket(url);
      ws.onopen = () => setStatus('ws open', 'ok');
      ws.onclose = () => setStatus('ws closed', 'bad');
      ws.onerror = () => setStatus('ws error', 'bad');
      ws.onmessage = (ev) => append(ev.data);
    }

    document.getElementById('compose').onsubmit = (e) => {
      e.preventDefault();
      const t = msgEl.value;
      if (!t.trim() || !ws || ws.readyState !== 1) return;
      ws.send(t);
      msgEl.value = '';
    };

    msgEl.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('compose').requestSubmit();
      }
    });

    document.getElementById('reconnect').onclick = connect;
    connect();
  </script>
</body>
</html>
